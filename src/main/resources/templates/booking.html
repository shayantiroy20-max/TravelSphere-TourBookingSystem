<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Tour Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
background:url("https://images.unsplash.com/photo-1501785888041-af3ef285b470") no-repeat center center/cover;
height:100vh;
}
.overlay{
background:rgba(0,0,0,0.6);
height:100%;
padding-top:40px;
}
.form-box{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 4px 15px rgba(0,0,0,0.5);
}
.summary{
background:#f4f6f8;
padding:15px;
border-radius:8px;
}
</style>
<script>
function updateHotels(){
let destination=document.getElementById("destination").value;
let hotel=document.getElementById("hotel");
hotel.innerHTML="";
let hotels={
Goa:[
{n:"Goa Beach Resort",p:4500},
{n:"Baga Luxury Hotel",p:5200},
{n:"Sunset Paradise Hotel",p:3800}
],
Manali:[
{n:"Snow Peak Resort",p:4800},
{n:"Himalayan Heights",p:3500},
{n:"Alpine Valley Resort",p:4200}
],
Darjeeling:[
{n:"Himalayan View Resort",p:4200},
{n:"Tea Garden Retreat",p:3500},
{n:"Cloud Nine Hotel",p:4700}
],
Rajasthan:[
{n:"Jaipur Palace Resort",p:6000},
{n:"Desert Heritage Hotel",p:4200},
{n:"Udaipur Lake Palace",p:7500}
],
Andaman:[
{n:"Andaman Beach Resort",p:6500},
{n:"Coral Reef Hotel",p:5200},
{n:"Blue Lagoon Resort",p:7200}
],
Kashmir:[
{n:"Kashmir Valley Resort",p:5000},
{n:"Dal Lake Palace",p:6800},
{n:"Snow View Retreat",p:3800}
]
};
if(!hotels[destination]) return;
hotels[destination].forEach(function(h){
let option=document.createElement("option");
option.text=h.n;
option.value=h.p;
hotel.add(option);
});
calculatePrice();
}
function calculatePrice(){
let days=document.getElementById("days").value;
let hotel=document.getElementById("hotel").value;
let meal=document.getElementById("meal").value;
let total=(Number(days)*Number(hotel))+Number(meal);
if(!total) total=0;
document.getElementById("price").innerHTML="₹ "+total;
document.getElementById("priceInput").value=total;
}
</script>
</head>
<body>
<div class="overlay">
<div class="container">
<div class="row justify-content-center">
<div class="col-md-6">
<div class="form-box">
<h2 class="text-center mb-4">Tour Booking Form</h2>
<form th:action="@{/payment}" method="post">
<label class="form-label">Full Name</label>
<input type="text" name="name" class="form-control" required>
<label class="form-label mt-3">Email</label>
<input type="email" name="email" class="form-control" required>
<label class="form-label mt-3">Phone</label>
<input type="text" name="phone" class="form-control" required>
<label class="form-label mt-3">Destination</label>
<select id="destination" name="destination" class="form-select" onchange="updateHotels()" required>
<option value="">Select Destination</option>
<option>Goa</option>
<option>Manali</option>
<option>Darjeeling</option>
<option>Rajasthan</option>
<option>Andaman</option>
<option>Kashmir</option>
</select>
<label class="form-label mt-3">Tour Duration (Days)</label>
<input type="number" id="days" name="days" class="form-control" min="1" onchange="calculatePrice()" required>
<label class="form-label mt-3">Select Hotel</label>
<select id="hotel" name="hotel" class="form-select" onchange="calculatePrice()" required>
<option value="0">Select Destination First</option>
</select>
<label class="form-label mt-3">Room Type</label>
<select name="room" class="form-select">
<option>Standard Room</option>
<option>Deluxe Room</option>
<option>Luxury Suite</option>
</select>
<label class="form-label mt-3">Meal Plan</label>
<select id="meal" name="meal" class="form-select" onchange="calculatePrice()">
<option value="0">No Meal</option>
<option value="300">Breakfast</option>
<option value="600">Breakfast + Lunch</option>
<option value="900">Breakfast + Lunch + Dinner</option>
</select>
<input type="hidden" id="priceInput" name="price" value="0">
<div class="summary mt-3 text-center">
<h5>Total Price</h5>
<h4 id="price">₹ 0</h4>
</div>
<button type="submit" class="btn btn-primary w-100 mt-4">
Proceed to Payment
</button>
</form>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
