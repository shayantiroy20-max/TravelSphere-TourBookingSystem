<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Admin Login</title>
<style>
body{
font-family:Arial;
background:linear-gradient(120deg,#2980b9,#6dd5fa);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.login-box{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0px 5px 20px rgba(0,0,0,0.3);
text-align:center;
width:320px;
}
.login-box h2{
margin-bottom:20px;
}
input{
width:90%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:14px;
}
button{
background:#3498db;
border:none;
color:white;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
width:95%;
font-size:16px;
}
button:hover{
background:#2980b9;
}
.error{
color:red;
margin-top:10px;
font-size:14px;
}
</style>
</head>
<body>
<div class="login-box">
<h2>Admin Login</h2>
<form th:action="@{/login}" method="post">
<input type="text" name="username" placeholder="Enter Username" required>
<input type="password" name="password" placeholder="Enter Password" required>
<button type="submit">Login</button>
</form>
<p class="error" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>
