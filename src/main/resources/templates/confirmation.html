<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Booking Confirmation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
background:#f5f7fa;
}
.success-box{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 4px 12px rgba(0,0,0,0.3);
}
.header{
background:#27ae60;
color:white;
padding:15px;
border-radius:8px;
text-align:center;
margin-bottom:20px;
}
.receipt{
background:#f4f6f8;
padding:20px;
border-radius:8px;
}
</style>
</head>
<body>
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-6">
<div class="success-box">
<div class="header">
<h2>Booking Confirmed 🎉</h2>
<p>Your tour booking has been successfully completed.</p>
</div>
<div class="receipt">
<h4 class="text-center mb-3">Booking Receipt</h4>
<table class="table table-bordered">
<tr>
<th>Name</th>
<td th:text="${booking.name}"></td>
</tr>
<tr>
<th>Email</th>
<td th:text="${booking.email}"></td>
</tr>
<tr>
<th>Phone</th>
<td th:text="${booking.phone}"></td>
</tr>
<tr>
<th>Destination</th>
<td th:text="${booking.destination}"></td>
</tr>
<tr>
<th>Hotel</th>
<td th:text="${booking.hotel}"></td>
</tr>
<tr>
<th>Room Type</th>
<td th:text="${booking.room}"></td>
</tr>
<tr>
<th>Meal Plan</th>
<td th:text="${booking.meal}"></td>
</tr>
<tr>
<th>Days</th>
<td th:text="${booking.days}"></td>
</tr>
<tr>
<th>Total Price</th>
<td>₹ <span th:text="${booking.price}"></span></td>
</tr>
</table>
</div>
<div class="text-center mt-4">
<button onclick="window.print()" class="btn btn-success me-2">
Print Receipt
</button>
<a href="/" class="btn btn-primary me-2">
Home
</a>
<a href="/history" class="btn btn-secondary">
Booking History
</a>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
