<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
background:#f5f7fa;
}
.dashboard-header{
background:#1e3d59;
color:white;
padding:20px;
text-align:center;
}
.stats{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 4px 10px rgba(0,0,0,0.2);
text-align:center;
}
</style>
</head>
<body>
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="/">Tour Booking</a>
<div>
<a class="btn btn-outline-light me-2" href="/">Home</a>
<a class="btn btn-outline-light me-2" href="/history">Booking History</a>
<a class="btn btn-outline-light" href="/login">Logout</a>
</div>
</div>
</nav>
<a href="/logout">
<button style="background:red">Logout</button>
</a>
<!-- DASHBOARD HEADER -->
<div class="dashboard-header">
<h2>Admin Dashboard</h2>
<p>Manage all tour bookings</p>
</div>
<div class="container mt-4">
<!-- STATS CARD -->
<div class="row mb-4">
<div class="col-md-4">
<div class="stats">
<h4>Total Bookings</h4>
<h2 th:text="${bookings != null ? #lists.size(bookings) : 0}"></h2>
</div>
</div>
</div>
<!-- BOOKINGS TABLE -->
<div class="card">
<div class="card-header bg-primary text-white">
<h4>All Bookings</h4>
</div>
<div class="card-body">
<div class="table-responsive">
<table class="table table-striped table-bordered">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Destination</th>
<th>Hotel</th>
<th>Room</th>
<th>Days</th>
<th>Meal</th>
<th>Price</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr th:each="b : ${bookings}">
<td th:text="${b.id}"></td>
<td th:text="${b.name}"></td>
<td th:text="${b.email}"></td>
<td th:text="${b.phone}"></td>
<td th:text="${b.destination}"></td>
<td th:text="${b.hotel}"></td>
<td th:text="${b.room}"></td>
<td th:text="${b.days}"></td>
<td th:text="${b.meal}"></td>
<td>₹ <span th:text="${b.price}"></span></td>
<td>
<a th:href="@{/delete/{id}(id=${b.id})}" 
class="btn btn-danger btn-sm">
Delete
</a>
</td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
</div>
<footer class="text-center mt-4 mb-3">
<p>© 2026 Tour Booking System | Admin Panel</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
