<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Payment</title>
<style>
body{
font-family:Arial;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.box{
background:white;
width:350px;
padding:30px;
border-radius:10px;
box-shadow:0px 4px 12px rgba(0,0,0,0.3);
text-align:center;
}
input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}
button{
padding:10px 20px;
background:#27ae60;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}
button:hover{
background:#219150;
}
</style>
</head>
<body>
<div class="box">
<h2>Payment Details</h2>
<form th:action="@{/confirmBooking}" method="post">
<!-- Hidden booking data -->
<input type="hidden" name="name" th:value="${booking.name}">
<input type="hidden" name="email" th:value="${booking.email}">
<input type="hidden" name="phone" th:value="${booking.phone}">
<input type="hidden" name="destination" th:value="${booking.destination}">
<input type="hidden" name="hotel" th:value="${booking.hotel}">
<input type="hidden" name="room" th:value="${booking.room}">
<input type="hidden" name="days" th:value="${booking.days}">
<input type="hidden" name="meal" th:value="${booking.meal}">
<input type="hidden" name="price" th:value="${booking.price}">
<label>Card Number</label>
<input type="text" placeholder="XXXX XXXX XXXX XXXX" required>
<label>Card Holder</label>
<input type="text" required>
<label>Expiry Date</label>
<input type="text" placeholder="MM/YY" required>
<label>CVV</label>
<input type="password" required>
<br><br>
<button type="submit">Pay Now</button>
</form>
</div>
</body>
</html>
